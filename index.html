              padding: 0;
              display: flex;
              align-items: center;
              justify-content: center;
            ">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="15" height="15" fill="currentColor"

          <div class="language-menu" id="languageMenu" style="display: none"></div>
        </div>
      </div>
    </div>
  </nav>

  <main>
    <div class="create-layout">
      <div class="preview-area">
        <div class="preview-container">
          <div class="preview-wrap">
            <div class="preview-label" data-translate="preview.desktop">
              Desktop 4K
            </div>
            <canvas id="previewDesktop"></canvas>
          </div>
          <div class="preview-wrap">
            <div class="preview-label" data-translate="preview.mobile">
              iPhone
            </div>
            <canvas id="previewMobile"></canvas>
          </div>
        </div>
      </div>

      <div class="controls-panel">
        <div class="control-group">
          <div class="control-label" data-translate="controls.pattern">
            Pattern
          </div>
          <div class="style-grid" id="styleGrid"></div>
        </div>

        <div class="control-group">
          <div class="control-label" data-translate="controls.palette">
            Palette
          </div>
          <div class="palette-row" id="paletteRow"></div>
        </div>

        <div class="control-group">
          <div class="control-label" data-translate="controls.mode">Mode</div>
          <div class="mode-toggle">
            <button class="mode-btn active" id="btnDark">
              <span class="mode-icon mode-icon-dark"></span>
              <span data-translate="nav.dark">Dark</span>
            </button>
            <button class="mode-btn" id="btnLight">
              <span class="mode-icon mode-icon-light"></span>
              <span data-translate="nav.light">Light</span>
            </button>
          </div>
        </div>

        <div class="control-group">
          <button class="btn-shuffle" id="btnShuffle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            <span data-translate="controls.generate">GENERATE VARIATION</span>
          </button>
        </div>

        <div class="export-group">
          <button class="btn-export btn-desktop" id="btnDesktop">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
              stroke-linejoin="round">
              <rect x="2" y="3" width="12" height="9" rx="1" />
              <path d="M5 15h6M8 12v3" />
            </svg>
            <span data-translate="controls.downloadDesktop">Download Desktop Wallpaper</span>
          </button>
          <div class="size-hint" data-translate="controls.desktopSize">
            3840 × 2160 px
          </div>

          <button class="btn-export btn-mobile" id="btnMobile">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
              stroke-linejoin="round">
              <rect x="4" y="1" width="8" height="14" rx="2" />
              <path d="M7.5 12.5h1" />
            </svg>
            <span data-translate="controls.downloadMobile">Download iPhone Wallpaper</span>
          </button>
          <div class="size-hint" data-translate="controls.mobileSize">
            1290 × 2796 px
          </div>
        </div>
      </div>
    </div>
  </main>

    <script type="module" src="assets/js/index.js"></script>
    <script type="module" src="assets/js/create.js"></script>
    <script src="assets/js/animations-interaction.js"></script>
  </body>
</html>
