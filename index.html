<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WallpGen - Create</title>
    <link rel="icon" href="../assets/img/icon.png" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <style>
      .create-layout {
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 24px;
        padding: 24px;
        padding-top: 68px;
        height: 100vh;
      }

      /* Mobile: stack preview above controls, allow scrolling */
      @media (max-width: 768px) {
        .create-layout {
          grid-template-columns: 1fr; /* single column */
          height: auto; /* stop clipping to viewport */
          min-height: 100vh;
          padding: 16px;
          padding-top: 60px;
          gap: 16px;
        }

        .controls-panel {
          overflow-y: visible; /* let the page scroll, not the panel */
          padding-top: 0;
        }

        .preview-container {
          flex-wrap: wrap; /* previews wrap instead of overflowing */
        }

        /* Cap preview sizes so they never exceed screen width */
        .preview-wrap canvas {
          max-width: 100%;
          height: auto;
        }

        #previewDesktop {
          width: 100%;
          max-width: 480px;
          height: auto;
        }

        #previewMobile {
          width: 120px;
          height: auto;
        }
      }

      .preview-area {
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
        justify-content: center;
      }

      .preview-container {
        display: flex;
        gap: 20px;
        align-items: flex-end;
        justify-content: center;
      }

      .preview-wrap {
        position: relative;
      }

      .preview-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1px;
        color: var(--text-muted);
        text-align: center;
        margin-bottom: 8px;
        text-transform: uppercase;
      }

      .preview-wrap canvas {
        border-radius: 16px;
        border: 2px solid var(--border);
        display: block;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      }

      .controls-panel {
        display: flex;
        flex-direction: column;
        gap: 20px;
        overflow-y: auto;
        padding-right: 4px;
        padding-top: 44px;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .control-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.5px;
        color: var(--text-muted);
        text-transform: uppercase;
      }

      .style-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .style-btn {
        background: var(--bg-card);
        border: 2px solid var(--border);
        border-radius: var(--radius);
        padding: 4px;
        cursor: pointer;
        transition: var(--transition);
        overflow: hidden;
      }

      .style-btn canvas {
        width: 100%;
        aspect-ratio: 16 / 10;
        border-radius: 10px;
        display: block;
      }

      .style-btn:hover {
        border-color: var(--text-muted);
      }
      .style-btn.active {
        border-color: var(--text);
      }

      .palette-row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .palette-swatch {
        width: 36px;
        height: 36px;
        border-radius: 50px;
        border: 2px solid var(--border);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition: var(--transition);
        padding: 0;
        background: none;
      }

      .palette-swatch span {
        flex: 1;
        display: block;
      }

      .palette-swatch:hover {
        border-color: var(--text-muted);
      }
      .palette-swatch.active {
        border-color: var(--text);
      }

      .mode-toggle {
        display: flex;
        gap: 6px;
      }

      .mode-btn {
        flex: 1;
        padding: 10px;
        border-radius: 50px;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-muted);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: var(--transition);
      }

      .mode-btn:hover {
        border-color: var(--text-muted);
        color: var(--text);
      }
      .mode-btn.active {
        background: var(--text);
        color: var(--bg);
        border-color: var(--text);
      }

      .mode-icon {
        width: 14px;
        height: 14px;
        border-radius: 50%;
      }

      .mode-icon-dark {
        background: #222;
        border: 1px solid #555;
      }
      .mode-icon-light {
        background: #eee;
        border: 1px solid #ccc;
      }

      .btn-shuffle {
        width: 100%;
        padding: 12px;
        border-radius: 50px;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 1px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: var(--transition);
      }

      .btn-shuffle:hover {
        background: var(--bg-hover);
        border-color: var(--text-muted);
      }

      .export-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: auto;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }

      .btn-export {
        width: 100%;
        padding: 12px;
        border-radius: 50px;
        border: none;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: var(--transition);
      }

      .btn-desktop {
        background: var(--text);
        color: var(--bg);
      }
      .btn-desktop:hover {
        opacity: 0.85;
      }
      .btn-mobile {
        background: var(--bg-card);
        color: var(--text);
        border: 1px solid var(--border) !important;
      }
      .btn-mobile:hover {
        background: var(--bg-hover);
      }

      .btn-apply {
        width: 100%;
        padding: 10px 20px;
        border-radius: 50px;
        border: none;
        background: var(--text);
        color: var(--bg);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: var(--transition);
        white-space: nowrap;
      }

      .btn-apply:hover {
        opacity: 0.85;
      }
      .btn-apply:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .size-hint {
        font-size: 11px;
        color: var(--text-muted);
        text-align: center;
        margin-top: -4px;
      }
    </style>
  </head>
  <body>
    <nav data-tauri-drag-region>
      <div></div>

      <div class="nav-actions">
        <div class="nav-tabs">
          <!-- Dark Mode -->
          <button
            class="nav-tab active"
            id="themeDark"
            title="Dark Mode"
            style="border: none; cursor: pointer"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 640 640"
              width="14"
              height="14"
              aria-hidden="true"
            >
              <path
                fill="rgb(247, 224, 29)"
                d="M320 64C178.6 64 64 178.6 64 320C64 461.4 178.6 576 320 576C388.8 576 451.3 548.8 497.3 504.6C504.6 497.6 506.7 486.7 502.6 477.5C498.5 468.3 488.9 462.6 478.8 463.4C473.9 463.8 469 464 464 464C362.4 464 280 381.6 280 280C280 207.9 321.5 145.4 382.1 115.2C391.2 110.7 396.4 100.9 395.2 90.8C394 80.7 386.6 72.5 376.7 70.3C358.4 66.2 339.4 64 320 64z"
              />
            </svg>
          </button>

          <!-- Light Mode -->
          <button
            class="nav-tab"
            id="themeLight"
            title="Light Mode"
            style="border: none; cursor: pointer"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 640 640"
              width="14"
              height="14"
              aria-hidden="true"
            >
              <path
                fill="rgb(247, 224, 29)"
                d="M320 32C328.4 32 336.3 36.4 340.6 43.7L396.1 136.3L500.9 110C509.1 108 517.8 110.4 523.7 116.3C529.6 122.2 532 131 530 139.1L503.7 243.8L596.4 299.3C603.6 303.6 608.1 311.5 608.1 319.9C608.1 328.3 603.7 336.2 596.4 340.5L503.7 396.1L530 500.8C532 509 529.6 517.7 523.7 523.6C517.8 529.5 509 532 500.9 530L396.2 503.7L340.7 596.4C336.4 603.6 328.5 608.1 320.1 608.1C311.7 608.1 303.8 603.7 299.5 596.4L243.9 503.7L139.2 530C131 532 122.4 529.6 116.4 523.7C110.4 517.8 108 509 110 500.8L136.2 396.1L43.6 340.6C36.4 336.2 32 328.4 32 320C32 311.6 36.4 303.7 43.7 299.4L136.3 243.9L110 139.1C108 130.9 110.3 122.3 116.3 116.3C122.3 110.3 131 108 139.2 110L243.9 136.2L299.4 43.6L301.2 41C305.7 35.3 312.6 31.9 320 31.9zM320 176C240.5 176 176 240.5 176 320C176 399.5 240.5 464 320 464C399.5 464 464 399.5 464 320C464 240.5 399.5 176 320 176zM320 416C267 416 224 373 224 320C224 267 267 224 320 224C373 224 416 267 416 320C416 373 373 416 320 416z"
              />
            </svg>
          </button>

          <!-- Language -->
          <div class="language-selector-container">
            <button
              class="language-btn"
              id="languageBtn"
              title="Language"
              style="
                border: none;
                cursor: pointer;
                background: none;
                padding: 6px 12px;
                border-radius: 50px;
                transition: var(--transition);
              "
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 640 640"
                width="15"
                height="15"
                aria-hidden="true"
              >
                <path
                  fill="rgb(247, 224, 29)"
                  d="M192 64C209.7 64 224 78.3 224 96L224 128L352 128C369.7 128 384 142.3 384 160C384 177.7 369.7 192 352 192L342.4 192L334 215.1C317.6 260.3 292.9 301.6 261.8 337.1C276 345.9 290.8 353.7 306.2 360.6L356.6 383L418.8 243C423.9 231.4 435.4 224 448 224C460.6 224 472.1 231.4 477.2 243L605.2 531C612.4 547.2 605.1 566.1 589 573.2C572.9 580.3 553.9 573.1 546.8 557L526.8 512L369.3 512L349.3 557C342.1 573.2 323.2 580.4 307.1 573.2C291 566 283.7 547.1 290.9 531L330.7 441.5L280.3 419.1C257.3 408.9 235.3 396.7 214.5 382.7C193.2 399.9 169.9 414.9 145 427.4L110.3 444.6C94.5 452.5 75.3 446.1 67.4 430.3C59.5 414.5 65.9 395.3 81.7 387.4L116.2 370.1C132.5 361.9 148 352.4 162.6 341.8C148.8 329.1 135.8 315.4 123.7 300.9L113.6 288.7C102.3 275.1 104.1 254.9 117.7 243.6C131.3 232.3 151.5 234.1 162.8 247.7L173 259.9C184.5 273.8 197.1 286.7 210.4 298.6C237.9 268.2 259.6 232.5 273.9 193.2L274.4 192L64.1 192C46.3 192 32 177.7 32 160C32 142.3 46.3 128 64 128L160 128L160 96C160 78.3 174.3 64 192 64zM448 334.8L397.7 448L498.3 448L448 334.8z"
                />
              </svg>
            </button>

            <div
              class="language-menu"
              id="languageMenu"
              style="display: none"
            ></div>
          </div>
        </div>
      </div>
    </nav>

    <main>
      <div class="create-layout">
        <div class="preview-area">
          <div class="preview-container">
            <div class="preview-wrap">
              <div class="preview-label" data-translate="preview.desktop">
                Desktop 4K
              </div>
              <canvas id="previewDesktop" width="640" height="360"></canvas>
            </div>
            <div class="preview-wrap">
              <div class="preview-label" data-translate="preview.mobile">
                iPhone
              </div>
              <canvas id="previewMobile" width="145" height="314"></canvas>
            </div>
          </div>
        </div>

        <div class="controls-panel">
          <div class="control-group">
            <div class="control-label" data-translate="controls.pattern">
              Pattern
            </div>
            <div class="style-grid" id="styleGrid"></div>
          </div>

          <div class="control-group">
            <div class="control-label" data-translate="controls.palette">
              Palette
            </div>
            <div class="palette-row" id="paletteRow"></div>
          </div>

          <div class="control-group">
            <div class="control-label" data-translate="controls.mode">Mode</div>
            <div class="mode-toggle">
              <button class="mode-btn active" id="btnDark">
                <span class="mode-icon mode-icon-dark"></span>
                <span data-translate="nav.dark">Dark</span>
              </button>
              <button class="mode-btn" id="btnLight">
                <span class="mode-icon mode-icon-light"></span>
                <span data-translate="nav.light">Light</span>
              </button>
            </div>
          </div>

          <div class="control-group">
            <button class="btn-shuffle" id="btnShuffle">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path
                  d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"
                ></path>
              </svg>
              <span data-translate="controls.generate">GENERATE VARIATION</span>
            </button>
          </div>

          <div class="export-group">
            <button class="btn-export btn-desktop" id="btnDesktop">
              <svg
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="2" y="3" width="12" height="9" rx="1" />
                <path d="M5 15h6M8 12v3" />
              </svg>
              <span data-translate="controls.downloadDesktop"
                >Download Desktop Wallpaper</span
              >
            </button>
            <div class="size-hint" data-translate="controls.desktopSize">
              3840 × 2160 px
            </div>

            <button class="btn-export btn-mobile" id="btnMobile">
              <svg
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="4" y="1" width="8" height="14" rx="2" />
                <path d="M7.5 12.5h1" />
              </svg>
              <span data-translate="controls.downloadMobile"
                >Download iPhone Wallpaper</span
              >
            </button>
            <div class="size-hint" data-translate="controls.mobileSize">
              1290 × 2796 px
            </div>
          </div>
        </div>
      </div>
    </main>

    <script type="module">
      import {
        setLanguage,
        getLanguage,
        t,
        getAvailableLanguages,
      } from "./assets/js/translate.js";

      function updateDOMText() {
        document.querySelectorAll("[data-translate]").forEach((el) => {
          const key = el.getAttribute("data-translate");
          el.textContent = t(key);
        });
      }

      function initializeLanguageSelector() {
        const languageBtn = document.getElementById("languageBtn");
        const languageMenu = document.getElementById("languageMenu");
        const currentLang = getLanguage();
        const languages = getAvailableLanguages();

        languageBtn.textContent =
          languages.find((l) => l.code === currentLang)?.flag || "🌐";

        languages.forEach((lang) => {
          const option = document.createElement("button");
          option.className =
            "language-option" + (lang.code === currentLang ? " active" : "");
          option.innerHTML = `
        <span class="language-option-flag">${lang.flag}</span>
        <span class="language-option-name">${lang.name}</span>
      `;
          option.onclick = () => {
            setLanguage(lang.code);
            updateDOMText();
            languageBtn.textContent = lang.flag;
            document
              .querySelectorAll(".language-option")
              .forEach((o) => o.classList.remove("active"));
            option.classList.add("active");
            languageMenu.style.display = "none";
          };
          languageMenu.appendChild(option);
        });

        languageBtn.onclick = (e) => {
          e.stopPropagation();
          languageMenu.style.display =
            languageMenu.style.display === "none" ? "grid" : "none";
        };

        document.addEventListener("click", () => {
          languageMenu.style.display = "none";
        });
      }

      setLanguage(getLanguage());
      updateDOMText();
      initializeLanguageSelector();

      function applyTheme(isDark) {
        const r = document.documentElement.style;
        if (isDark) {
          r.setProperty("--bg", "#0a0a0a");
          r.setProperty("--bg-card", "#151515");
          r.setProperty("--bg-hover", "#1e1e1e");
          r.setProperty("--bg-nav", "rgba(15,15,15,0.85)");
          r.setProperty("--text", "#f0f0f0");
          r.setProperty("--text-muted", "#888");
          r.setProperty("--border", "#222");
        } else {
          r.setProperty("--bg", "#f0f0f0");
          r.setProperty("--bg-card", "#ffffff");
          r.setProperty("--bg-hover", "#e4e4e4");
          r.setProperty("--bg-nav", "rgba(240,240,240,0.85)");
          r.setProperty("--text", "#111");
          r.setProperty("--text-muted", "#666");
          r.setProperty("--border", "#ddd");
        }
      }

      const saved = localStorage.getItem("wllpr-theme") || "dark";
      applyTheme(saved === "dark");
      if (saved === "light") {
        document.getElementById("themeLight").classList.add("active");
        document.getElementById("themeDark").classList.remove("active");
      }

      document.getElementById("themeDark").onclick = () => {
        localStorage.setItem("wllpr-theme", "dark");
        applyTheme(true);
        document.getElementById("themeDark").classList.add("active");
        document.getElementById("themeLight").classList.remove("active");
      };

      document.getElementById("themeLight").onclick = () => {
        localStorage.setItem("wllpr-theme", "light");
        applyTheme(false);
        document.getElementById("themeLight").classList.add("active");
        document.getElementById("themeDark").classList.remove("active");
      };
    </script>
    <script type="module" src="../assets/js/create.js"></script>
  </body>
</html>
